[project]
name = "guardrail"
version = "0.1.0"
description = "Configurable LLM guardrail and benchmark harness"
requires-python = ">=3.12"
# core: copy along with core/ into production
dependencies = [
    "pydantic==2.14.3",
    "PyYAML==6.0.3",
    "httpx==0.28.1",
]

[dependency-groups]
# eval and main.py
eval = ["python-dotenv==1.2.4"]
dev = ["pytest==9.2.0"]

[tool.uv]
package = false
